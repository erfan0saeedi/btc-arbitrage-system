version: '3.8'

services:
  arbitrage-redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  arbitrage-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: trade
    ports:
      - "3306:3306"
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql

  app:
    build: .
    depends_on:
      - arbitrage-redis
      - arbitrage-mysql
    env_file:
      - .env